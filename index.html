<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muito Fio — Ateliê Artesanal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  </head>
<body>
  <div class="cursor" id="cursor"></div>


  <button class="secret-btn" onclick="openModal()">Caixa de Costura</button>

  <section class="hero">
    <div class="hero-grain"></div>
    <div class="hero-logo-wrap" style="text-align: center; margin-bottom: 2rem;">
      <img src="assets/brand/SVG Sample.svg" alt="Muito Fio" style="height: 120px; max-width: 90vw; width: auto; opacity: 0.9;">
    </div>
    <div class="hero-tagline">Ateliê Artesanal</div>
    <p class="hero-slogan">Costurando conforto, memória e afeto para o seu lar.</p>
  </section>

  <div class="modal-overlay" id="secretModal">
    <div class="modal-box">
      <h2 class="modal-title">Caixa de Costura</h2>
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 2rem;">Área restrita do ateliê Muito Fio.</p>
      <input type="password" id="passwordInput" class="modal-input" placeholder="Digite a senha" onkeypress="handleEnter(event)">
      <button class="modal-btn" onclick="checkPassword()">Abrir</button>
      <div class="error-msg" id="errorMsg">Ops! Senha incorreta. Tente novamente.</div>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('secretModal').classList.add('active');
      document.getElementById('passwordInput').focus();
    }
    
    // Close modal if clicked outside
    document.getElementById('secretModal').addEventListener('click', function(e) {
      if(e.target === this) {
        this.classList.remove('active');
        document.getElementById('errorMsg').style.display = 'none';
        document.getElementById('passwordInput').value = '';
      }
    });

    function checkPassword() {
      const pwd = document.getElementById('passwordInput').value.toLowerCase().trim();
      if(pwd === 'amora') {
        window.location.href = 'pages/caixa_de_costura.html';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('passwordInput').value = '';
      }
    }

    function handleEnter(e) {
      if(e.key === 'Enter') checkPassword();
    }
  </script>
  <script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
    document.querySelectorAll('a,button,.slogan-card,.s-prod-card,.swatch,.rule-card').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('big'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('big'));
    });
  </script>
</body>
</html>
